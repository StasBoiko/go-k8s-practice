apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: dev
data:
  APP_ENV: "dev"
  APP_VERSION: "0.1.0"
  HTTP_PORT: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: dev
type: Opaque
stringData:
  DATABASE_URL: "postgres://practice_user:practice_pass@postgres:5432/practice_db?sslmode=disable"
